name: Build app

# Builds the download-and-run app for Windows, macOS and Linux, with Stockfish inside.
# Run manually (Actions -> Build app -> Run workflow) for test builds; pushing a tag
# like v0.1.0 also publishes the zips as a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-14
            name: Mac-AppleSilicon
          - os: macos-15-intel
            name: Mac-Intel
          - os: ubuntu-latest
            name: Linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install . pytest pyinstaller

      - name: Get Stockfish for this platform
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m nemesis.analysis.install --dest packaging/stockfish
          echo "STOCKFISH_PATH=$(ls packaging/stockfish/stockfish* | head -1)" >> "$GITHUB_ENV"

      - name: Test
        run: python -m pytest -q

      - name: Build
        run: pyinstaller --noconfirm packaging/nemesis.spec

      - name: Smoke test the built app
        run: |
          unset STOCKFISH_PATH
          python packaging/smoke_test.py "dist/Nemesis$([ "$RUNNER_OS" = Windows ] && echo .exe)"

      - name: Package
        run: |
          mkdir -p "out/Nemesis"
          cp dist/Nemesis* "out/Nemesis/"
          cp "packaging/READ ME FIRST - ${RUNNER_OS}.txt" "out/Nemesis/READ ME FIRST.txt"
          python -c "import shutil; shutil.make_archive('Nemesis-${{ matrix.name }}', 'zip', 'out')"

      - uses: actions/upload-artifact@v4
        with:
          name: Nemesis-${{ matrix.name }}
          path: Nemesis-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: zips
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: zips/*.zip
          generate_release_notes: true
