[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nemesis"
version = "0.5.8"
description = "A personal chess engine: it learns how you play, then plays the move that beats you."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "chess>=1.10",
    "numpy>=1.24",
    "httpx>=0.25",
    "fastapi>=0.110",
    "uvicorn>=0.25",
    # Runs the Maia-2 human-move model. Only where onnxruntime has builds (Python 3.11-3.14 today);
    # elsewhere Nemesis works without Maia-2 and says so on the Profile tab.
    "onnxruntime>=1.17; python_version < '3.15'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
nemesis = "nemesis.cli:main"

[tool.setuptools.packages.find]
include = ["nemesis*"]

[tool.setuptools.package-data]
"nemesis.web" = ["static/*"]
"nemesis" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
